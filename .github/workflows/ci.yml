name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Versão exata, sem ^: o build commitado precisa bater com o que a
      # CI gera, e compiladores diferentes produzem saídas diferentes.
      # Era a causa de a checagem abaixo falhar.
      - name: Instalar o compilador
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Conferir a versão do compilador
        run: npx tsc --version

      - name: Checar os tipos
        run: npm run check

      - name: Conferir se o build commitado está atualizado
        run: |
          npm run build
          if ! git diff --quiet -- assets/js; then
            echo "::error::assets/js está desatualizado. Rode 'npm run build' e faça commit do resultado."
            git diff --stat -- assets/js
            exit 1
          fi

  segredos:
    name: Segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # O histórico inteiro: um segredo apagado no último commit
          # continua recuperável nos anteriores.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Procurar segredo no que está versionado
        run: python tools/checar_segredos.py

      - name: Conferir que nenhum .env está versionado
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::O arquivo .env está versionado. Remova-o e troque a senha."
            exit 1
          fi
          echo "Nenhum .env versionado."

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar os testes
        run: python -m unittest discover -s tools -v
