# Serve o site e repassa /api para a API, de modo que o navegador veja
# tudo na mesma origem e o CORS deixe de ser um problema.

server {
    listen 80;
    server_name localhost;

    # Não anunciar a versão do nginx: é informação gratuita para quem
    # procura uma versão com falha conhecida.
    server_tokens off;

    # Corpo de requisição pequeno: este servidor só entrega arquivos
    # estáticos e repassa JSON curto para a API.
    client_max_body_size 64k;
    root /usr/share/nginx/html;
    index index.html;

    # Módulos ES precisam do tipo correto, senão o navegador recusa.
    types {
        text/html                 html;
        text/css                  css;
        text/javascript           js mjs;
        application/json          json map;
        image/svg+xml             svg;
    }

    # Em desenvolvimento, nada de cache: recompilou, recarregou, apareceu.
    add_header Cache-Control "no-store, max-age=0" always;

    # --- Cabeçalhos de segurança ---------------------------------------
    #
    # A política de conteúdo é restritiva porque o app permite: nenhum
    # script embutido (o único <script> tem src), e as únicas origens
    # externas são as fontes do Google.
    #
    # 'unsafe-inline' aparece só em style-src, e é inevitável: o HTML tem
    # três atributos style= e o JavaScript ajusta transform para animar
    # as barras de progresso. Não vale para script-src, que é o que
    # realmente barra XSS.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    # Impede que o conteúdo seja lido como outro tipo (ex.: .txt virar script).
    add_header X-Content-Type-Options "nosniff" always;

    # Impede embutir o app num iframe de outro site (clickjacking).
    add_header X-Frame-Options "DENY" always;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # O app não usa nenhuma dessas: desligar evita que um comprometimento
    # futuro peça acesso em nome dele.
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
