# Serve o site e repassa /api para a API, de modo que o navegador veja
# tudo na mesma origem e o CORS deixe de ser um problema.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Módulos ES precisam do tipo correto, senão o navegador recusa.
    types {
        text/html                 html;
        text/css                  css;
        text/javascript           js mjs;
        application/json          json map;
        image/svg+xml             svg;
    }

    # Em desenvolvimento, nada de cache: recompilou, recarregou, apareceu.
    add_header Cache-Control "no-store, max-age=0" always;

    # Cabeçalhos de segurança básicos.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
