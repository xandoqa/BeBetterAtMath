<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Be Better at Math</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- SPLASH -->
    <div id="splash" class="screen">
      <h1>Be Better at Math</h1>
    </div>

    <!-- MENU -->
    <div id="menu" class="screen hidden">
      <h2>Menu</h2>
      <button onclick="openTabuadaConfig()">Tabuada</button>
      <button onclick="openRandomConfig()">Números Aleatórios</button>
      <button class="disabled" onclick="alert('Não disponível')">Sudoku</button>
      <button class="disabled" onclick="alert('Não disponível')">Lógica</button>
    </div>

    <!-- TABUADA CONFIG -->
    <div id="tabuadaConfig" class="screen hidden">
      <h2>Tabuada</h2>
      <button onclick="startTabuada('easy')">Fácil (1–10)</button>
      <button onclick="startTabuada('medium')">Médio (10–50)</button>
      <button onclick="startTabuada('hard')">Difícil (50–100)</button>
      <button class="secondary" onclick="goMenu()">Voltar</button>
    </div>

    <!-- TABUADA GAME -->
    <div id="tabuadaGame" class="screen hidden">
      <div class="operation" id="tabuadaOperation"></div>
      <input type="number" id="tabuadaAnswer" placeholder="Resposta" />
      <button onclick="checkTabuada()">Responder</button>
      <div class="message" id="tabuadaMessage"></div>
    </div>

    <!-- RANDOM CONFIG -->
    <div id="randomConfig" class="screen hidden">
      <h2>Números Aleatórios</h2>
      <button onclick="startRandom('sum')">Soma</button>
      <button onclick="startRandom('mul')">Multiplicação</button>
      <button onclick="startRandom('div')">Divisão</button>
      <button class="secondary" onclick="goMenu()">Voltar</button>
    </div>

    <!-- RANDOM GAME -->
    <div id="randomGame" class="screen hidden">
      <div class="operation" id="randomOperation"></div>
      <input type="number" id="randomAnswer" placeholder="Resposta" />
      <button onclick="checkRandom()">Responder</button>
      <div class="message" id="randomMessage"></div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
